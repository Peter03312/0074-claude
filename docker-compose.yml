services:
  api:
    build: .
    image: melody-compare:latest
    container_name: melody-api
    restart: unless-stopped
    environment:
      # 宿主端口可通过环境变量 API_PORT 改写；容器内固定监听 8000
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/health', timeout=2).status_code==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    image: melody-compare:latest
    build: .
    container_name: melody-verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE: http://api:8000
    entrypoint: ["bash", "scripts/verify.sh"]
    restart: "no"
